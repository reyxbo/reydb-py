[project]
name = "reydb"
version = "1.3.74"
description = "Database engine and connection pool package. It provides database engine, connection pool, database connection, SQL execution, ORM mapping, database metadata, database configuration, and table structure management capabilities."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = [
    "rey",
    "reyxbo",
    "PostgreSQL",
    "postgres",
    "db",
    "database",
    "orm",
    "async",
    "asynchronous",
    "build"
]
authors = [
    {name = "Rey", email = "reyxbo@163.com"}
]
dependencies = [
    "asyncpg",
    "psycopg[binary]",
    "pydantic[email]",
    "reykit",
    "sqlalchemy==2.0.42",
    "sqlmodel"
]

[project.urls]
Homepage = "https://www.reyxbo.com/release/python/reydb"
Repository = "https://github.com/reyxbo/reydb-py.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
